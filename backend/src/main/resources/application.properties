# Aplicação
spring.application.name=pacto-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${PACTO_DB_PORT:5433}/${PACTO_DB_NAME:pacto}
spring.datasource.username=${PACTO_DB_USER:pacto}
spring.datasource.password=${PACTO_DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
