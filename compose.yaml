services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PACTO_DB_NAME}
      POSTGRES_USER: ${PACTO_DB_USER}
      POSTGRES_PASSWORD: ${PACTO_DB_PASSWORD}

    ports:
      - "127.0.0.1:${PACTO_DB_PORT}:5432"

    volumes:
      - pacto_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pacto_postgres_data:
